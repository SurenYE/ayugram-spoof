# AyuGram Spoof: Windows x64 build + Inno Setup installer.
# Two jobs so the dependency build gets its own 6h budget and is cached
# for the client job. Based on upstream canary.yml windows job, stripped
# of signing/bot/R2.
name: Windows Spoof Setup

on:
  push:
    branches: [spoof-panel]
  workflow_dispatch:

env:
  SDK: 10.0.26100.0

jobs:
  libraries:
    name: Windows libraries
    runs-on: windows-latest
    timeout-minutes: 360
    defaults:
      run:
        shell: cmd
    steps:
      - name: Prepare directories.
        run: |
          mkdir D:\TBuild\Libraries
          mklink /d %GITHUB_WORKSPACE%\TBuild D:\TBuild
          echo TBUILD=%GITHUB_WORKSPACE%\TBuild>>%GITHUB_ENV%
          echo LibrariesPath=%GITHUB_WORKSPACE%\TBuild\Libraries\win64>>%GITHUB_ENV%

      - name: Get repository name.
        shell: bash
        run: echo "REPO_NAME=${GITHUB_REPOSITORY##*/}" >> $GITHUB_ENV

      - uses: actions/checkout@v4
        with:
          path: ${{ env.TBUILD }}\${{ env.REPO_NAME }}

      - name: Submodules.
        shell: bash
        working-directory: ${{ env.TBUILD }}/${{ env.REPO_NAME }}
        run: git submodule update --init --depth=1

      - name: Cache key.
        shell: bash
        run: |
          sha256sum "$TBUILD/$REPO_NAME/Telegram/build/prepare/prepare.py" | awk '{ print $1 }' > CACHE_KEY.txt
          echo "10.0.26100.0" >> CACHE_KEY.txt
          echo "CACHE_KEY=$(sha256sum CACHE_KEY.txt | awk '{ print $1 }')" >> $GITHUB_ENV

      - name: Visual Studio ATL component.
        shell: pwsh
        run: |
          $installer = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio\Installer'
          $vswhere = Join-Path $installer 'vswhere.exe'
          $setup = Join-Path $installer 'setup.exe'
          $toolsComponent = 'Microsoft.VisualStudio.Component.VC.14.44.17.14.x86.x64'
          $atlComponent = 'Microsoft.VisualStudio.Component.VC.14.44.17.14.ATL'
          $path = @(& $vswhere -latest -products '*' -requires $toolsComponent -property installationPath)[0]
          if (-not $path) { throw "No Visual Studio instance provides $toolsComponent." }
          $toolset = Get-ChildItem (Join-Path $path 'VC\Tools\MSVC') -Directory `
            | Where-Object { $_.Name -like '14.44.*' } `
            | Sort-Object Name -Descending | Select-Object -First 1
          if (-not $toolset) { throw "No 14.44 toolset." }
          $header = Join-Path $toolset.FullName 'atlmfc\include\atlbase.h'
          if (Test-Path $header) { Write-Host "ATL already installed."; exit 0 }
          $process = Start-Process -FilePath $setup -Wait -PassThru -ArgumentList @(
            'modify', '--installPath', "`"$path`"",
            '--add', $atlComponent, '--quiet', '--norestart', '--nocache')
          if ($process.ExitCode -notin @(0, 3010)) {
            throw "Visual Studio Installer exited with $($process.ExitCode)." }
          if (-not (Test-Path $header)) { throw "$atlComponent completed without $header." }

      - name: Native Tools Command Prompt.
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64
          sdk: ${{ env.SDK }}
          toolset: '14.44'

      - name: NuGet sources.
        run: |
          nuget sources Disable -Name "Microsoft Visual Studio Offline Packages"
          nuget sources Add -Source https://api.nuget.org/v3/index.json & exit 0

      - name: ThirdParty cache.
        id: cache-third-party
        uses: actions/cache/restore@v4
        with:
          path: ${{ env.TBUILD }}\ThirdParty
          key: ${{ runner.OS }}-third-party-${{ env.CACHE_KEY }}
          restore-keys: ${{ runner.OS }}-third-party-

      - name: Libraries cache.
        id: cache-libs
        uses: actions/cache/restore@v4
        with:
          path: ${{ env.LibrariesPath }}
          key: ${{ runner.OS }}-libs-${{ env.CACHE_KEY }}
          restore-keys: ${{ runner.OS }}-libs-

      - name: Disk before.
        shell: bash
        run: df -h /c 2>/dev/null || df -h

      - name: Libraries.
        run: |
          %TBUILD%\%REPO_NAME%\Telegram\build\prepare\win.bat silent

      - name: Free up some disk space.
        shell: bash
        run: find $LibrariesPath '(' '(' ! '(' -name '*.lib' -o -name '*.a' -o -name '*.exe' -o -name '*.h' -o -name '*.hpp' -o -name '*.inc' -o -name '*.cmake' -o -name '*.pc' -o -path '*/include/*' -o -path '*/objects-*' -o -path '*/cache_keys/*' -o -path '*/patches/*' -o -path '*/nv-codec-headers/*' ')' -type f ')' -o -empty ')' -delete

      - name: Disk after.
        shell: bash
        run: du -sh $LibrariesPath $TBUILD/ThirdParty; df -h

      - name: Save ThirdParty cache.
        if: steps.cache-third-party.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ${{ env.TBUILD }}\ThirdParty
          key: ${{ steps.cache-third-party.outputs.cache-primary-key }}

      - name: Save Libraries cache.
        if: steps.cache-libs.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ${{ env.LibrariesPath }}
          key: ${{ steps.cache-libs.outputs.cache-primary-key }}

  client:
    name: Windows client + setup
    runs-on: windows-latest
    timeout-minutes: 360
    needs: libraries
    defaults:
      run:
        shell: cmd
    steps:
      - name: Prepare directories.
        run: |
          mkdir D:\TBuild\Libraries
          mklink /d %GITHUB_WORKSPACE%\TBuild D:\TBuild
          echo TBUILD=%GITHUB_WORKSPACE%\TBuild>>%GITHUB_ENV%
          echo LibrariesPath=%GITHUB_WORKSPACE%\TBuild\Libraries\win64>>%GITHUB_ENV%

      - name: Get repository name.
        shell: bash
        run: echo "REPO_NAME=${GITHUB_REPOSITORY##*/}" >> $GITHUB_ENV

      - uses: actions/checkout@v4
        with:
          path: ${{ env.TBUILD }}\${{ env.REPO_NAME }}

      - name: Submodules.
        shell: bash
        working-directory: ${{ env.TBUILD }}/${{ env.REPO_NAME }}
        run: git submodule update --init --depth=1

      - name: Cache key.
        shell: bash
        run: |
          sha256sum "$TBUILD/$REPO_NAME/Telegram/build/prepare/prepare.py" | awk '{ print $1 }' > CACHE_KEY.txt
          echo "10.0.26100.0" >> CACHE_KEY.txt
          echo "CACHE_KEY=$(sha256sum CACHE_KEY.txt | awk '{ print $1 }')" >> $GITHUB_ENV

      - name: Native Tools Command Prompt.
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64
          sdk: ${{ env.SDK }}
          toolset: '14.44'

      - name: ThirdParty cache.
        uses: actions/cache@v4
        with:
          path: ${{ env.TBUILD }}\ThirdParty
          key: ${{ runner.OS }}-third-party-${{ env.CACHE_KEY }}
          enableCrossOsArchive: false

      - name: Libraries cache.
        uses: actions/cache@v4
        with:
          path: ${{ env.LibrariesPath }}
          key: ${{ runner.OS }}-libs-${{ env.CACHE_KEY }}

      # WHY: MSVC compiling tdesktop's template-heavy TUs needs far more
      # commit charge than the runner's 16 GB RAM + default pagefile;
      # C1060 (out of heap space) otherwise kills the build mid-project.
      - name: Grow pagefile.
        shell: pwsh
        run: |
          $cs = Get-CimInstance -ClassName Win32_ComputerSystem
          if ($cs.AutomaticManagedPagefile) {
            Set-CimInstance -InputObject $cs -Property @{AutomaticManagedPagefile = $false}
          }
          Get-CimInstance -ClassName Win32_PageFileSetting | Remove-CimInstance
          New-CimInstance -ClassName Win32_PageFileSetting -Property @{
            Name = 'D:\pagefile.sys'
            InitialSize = [uint32]65536
            MaximumSize = [uint32]65536 } | Out-Null
          Start-Sleep -Seconds 5
          Get-CimInstance -ClassName Win32_PageFileUsage | Format-List Name, AllocatedBaseSize

      - name: Telegram Desktop build.
        run: |
          cd %TBUILD%\%REPO_NAME%\Telegram
          call configure.bat ^
          x64 ^
          -D TDESKTOP_API_ID=2040 ^
          -D TDESKTOP_API_HASH=b18441a1ff607e10a989891a5462e627 ^
          -D CMAKE_CONFIGURATION_TYPES=Release ^
          -D DESKTOP_APP_DISABLE_AUTOUPDATE=ON ^
          -D DESKTOP_APP_DISABLE_CRASH_REPORTS=ON
          cmake --build ..\out --config Release

      - name: Install Inno Setup.
        shell: pwsh
        run: choco install innosetup -y --no-progress

      - name: Build setup.exe.
        run: |
          cd %TBUILD%\%REPO_NAME%\Telegram\build
          "C:\Program Files (x86)\Inno Setup 6\iscc.exe" /DMyAppVersion=7.2.9 /DMyAppVersionZero=7.2.9 /DMyAppVersionFull=7.2.9 "/dReleasePath=%TBUILD%\%REPO_NAME%\out\Release" /DMyBuildTarget=win64 /DMyOutputBaseFilename=AyuGram-Spoof-setup-x64 setup.iss

      - name: Upload artifact.
        uses: actions/upload-artifact@v4
        with:
          name: ayugram-spoof-win64
          path: |
            ${{ env.TBUILD }}/${{ env.REPO_NAME }}/out/Release/AyuGram-Spoof-setup-x64.exe
            ${{ env.TBUILD }}/${{ env.REPO_NAME }}/out/Release/AyuGram.exe
